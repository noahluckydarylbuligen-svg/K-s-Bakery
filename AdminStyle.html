<style>
/* Modern Admin Dashboard Styling for K's Bakery */
:root {
  --primary-color: #d97706;
  --primary-hover: #b45309;
  --bg-color: #0f172a;
  --card-bg: #1e293b;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --border-color: #334155;
  --success-color: #10b981;
  --danger-color: #ef4444;
}

body.admin-page {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
}

.admin-wrapper {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
}

.admin-header h1 {
  margin: 0 0 6px 0;
  font-size: 26px;
  color: #fbbf24;
}

.admin-header .subtitle {
  margin: 0;
  color: var(--text-muted);
  font-size: 14px;
}

.logoutBtn {
  background-color: #334155;
  color: #f8fafc;
  border: 1px solid var(--border-color);
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.logoutBtn:hover {
  background-color: var(--danger-color);
  border-color: var(--danger-color);
}

.adminTabs {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

.adminTabs button {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.adminTabs button.active,
.adminTabs button:hover {
  background: var(--primary-color);
  color: #ffffff;
  border-color: var(--primary-color);
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 16px;
}

.addBtn {
  background: var(--primary-color);
  color: #ffffff;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}

.addBtn:hover {
  background: var(--primary-hover);
}

.toolbar input[type="text"] {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 14px;
  width: 280px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.cardStat {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}

.cardStat h2 {
  margin: 0;
  font-size: 32px;
  color: #fbbf24;
}

.cardStat p {
  margin: 6px 0 0 0;
  color: var(--text-muted);
  font-size: 14px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card-bg);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border-color);
}

th, td {
  padding: 14px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
  font-size: 14px;
}

th {
  background: #0f172a;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.5px;
}

.table-img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 6px;
  background: #334155;
}

.badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  display: inline-block;
}

.badge-success {
  background: rgba(16, 185, 129, 0.15);
  color: #34d399;
}

.badge-danger {
  background: rgba(239, 68, 68, 0.15);
  color: #f87171;
}

.tag-badge {
  background: #d97706;
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
  vertical-align: middle;
}

.action-buttons button {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  margin-right: 6px;
}

.editBtn {
  background: #3b82f6;
  color: #fff;
}

.editBtn:hover {
  background: #2563eb;
}

.deleteBtn {
  background: #ef4444;
  color: #fff;
}

.deleteBtn:hover {
  background: #dc2626;
}

.settings-card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 24px;
  max-width: 700px;
}

.settings-card label {
  display: block;
  font-weight: 600;
  margin-top: 14px;
  margin-bottom: 6px;
  font-size: 14px;
  color: var(--text-muted);
}

.settings-card input[type="text"],
.settings-card input[type="email"] {
  width: 100%;
  box-sizing: border-box;
  background: #0f172a;
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
}

.settings-card hr {
  border: none;
  border-top: 1px solid var(--border-color);
  margin: 24px 0;
}

.previewImage {
  max-width: 250px;
  max-height: 120px;
  object-fit: contain;
  display: block;
  margin-bottom: 12px;
  border-radius: 8px;
  background: #0f172a;
  border: 1px solid var(--border-color);
}

.previewBanner {
  max-width: 100%;
  max-height: 200px;
  object-fit: cover;
  display: block;
  margin-bottom: 12px;
  border-radius: 8px;
  background: #0f172a;
  border: 1px solid var(--border-color);
}

.saveBtn {
  background: var(--primary-color);
  color: #fff;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
}

.saveBtn:hover {
  background: var(--primary-hover);
}

.cancelBtn {
  background: #475569;
  color: #fff;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
}

.cancelBtn:hover {
  background: #334155;
}

/* Modal styling */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal-content {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 28px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.modal-content h2 {
  margin: 0 0 12px 0;
  font-size: 20px;
  color: #fbbf24;
}

.modal-content input,
.modal-content select,
.modal-content textarea {
  background: #0f172a;
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}

.modal-content textarea {
  height: 80px;
  resize: vertical;
}
</style>
